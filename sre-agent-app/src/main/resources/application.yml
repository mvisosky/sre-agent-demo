server:
  port: 8080

spring:
  application:
    name: sre-agent-app

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/sre_agent_db}
    username: ${POSTGRES_USER:sre_user}
    password: ${POSTGRES_PASSWORD:sre_password}
    driver-class-name: org.postgresql.Driver

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:your-anthropic-api-key}
      chat:
        model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 384

sre:
  playbook:
    seed-on-startup: ${SRE_SEED_PLAYBOOKS:true}
  agent:
    reports-dir: ${SRE_REPORTS_DIR:./reports}
    deduplication:
      enabled: ${SRE_DEDUP_ENABLED:true}
      window: ${SRE_DEDUP_WINDOW:15m}
      symptom-similarity-threshold: ${SRE_DEDUP_SIMILARITY_THRESHOLD:0.20}
      correlate-same-service-critical: ${SRE_DEDUP_SAME_SERVICE_CRITICAL:true}
      max-active-incidents: ${SRE_DEDUP_MAX_ACTIVE:500}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
