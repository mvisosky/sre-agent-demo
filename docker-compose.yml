services:
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: sre-agent-pgvector
    environment:
      POSTGRES_DB: sre_agent_db
      POSTGRES_USER: sre_user
      POSTGRES_PASSWORD: sre_password
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre_user -d sre_agent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
